  <text x="28" y="38" font-family="sans-serif" font-size="14" fill="#58a6ff" font-weight="500">AuthForge.cc</text>
  <text x="115" y="38" font-family="sans-serif" font-size="12" fill="#8b949e"> — Licensing API for Desktop Software</text>

  <text x="28" y="70" font-family="sans-serif" font-size="12" fill="#8b949e">A drop-in licensing API for desktop apps — license keys, hardware locking (HWID), and</text>
  <text x="28" y="88" font-family="sans-serif" font-size="12" fill="#8b949e">Ed25519-signed validation. Unlimited apps and licenses. Pay per auth call, never per seat.</text>

