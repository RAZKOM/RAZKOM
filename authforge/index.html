<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#010409" />
  <title>AuthForge — redirecting to authforge.cc</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://authforge.cc/" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/authforge.svg" />
  <script>
    // Old /authforge/ links now go straight to authforge.cc. Our referral
    // tags are the defaults; any tags already on the incoming link win, and
    // incoming UTM tags replace ours as a set so campaigns are not mixed.
    (function () {
      var target = new URL('https://authforge.cc/');
      var incoming = new URLSearchParams(location.search);
      var hasUtm = false;
      incoming.forEach(function (v, k) {
        if (k.indexOf('utm_') === 0) hasUtm = true;
      });
      target.searchParams.set('ref', 'razkom');
      if (!hasUtm) {
        target.searchParams.set('utm_source', 'razkom.com');
        target.searchParams.set('utm_medium', 'referral');
        target.searchParams.set('utm_campaign', 'authforge-page');
      }
      incoming.forEach(function (v, k) {
        target.searchParams.set(k, v);
      });
      target.hash = location.hash;
      location.replace(target.toString());
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://authforge.cc/?ref=razkom&amp;utm_source=razkom.com&amp;utm_medium=referral&amp;utm_campaign=authforge-page" />
  </noscript>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <main class="wrap" style="padding-top:48px">
    <p>AuthForge lives at <a href="https://authforge.cc/?ref=razkom&amp;utm_source=razkom.com&amp;utm_medium=referral&amp;utm_campaign=authforge-page">authforge.cc</a>. Taking you there now.</p>
  </main>
</body>
</html>
